directories:
  output: dist
  buildResources: build
appId: com.example.imageSequenceToWebP
productName: WebP Sequence
asar: true
files:
  - filter:
      - main.js
      - preload.js
      - renderer/**/*
      - node_modules/ffmpeg-static/**/*
win:
  target:
    - portable
    - nsis
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: null
  uninstallerIcon: null
  installerHeaderIcon: null
portable:
  artifactName: ${productName}-${version}-portable.exe
electronVersion: 29.4.6
