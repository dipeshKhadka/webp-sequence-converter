directories:
  output: dist
  buildResources: build
appId: com.example.imageSequenceToWebP
productName: WebP Sequence
files:
  - filter:
      - '**/*'
win:
  target:
    - nsis
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
electronVersion: 29.4.6
